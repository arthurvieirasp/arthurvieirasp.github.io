<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radinho Preto TV</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
#radioBackground {
  background-size: cover;
  background-position: center;
}
</style>
</head>

<body class="bg-black text-gray-100 w-screen h-screen overflow-hidden font-sans select-none">

<div class="flex flex-col h-full">

  <!-- TOPO -->
  <div class="flex justify-between items-center px-10 py-6 border-b border-gray-800">
    <button onclick="toggleScreen()" class="text-sm px-4 py-2 border border-gray-700 rounded-lg hover:bg-gray-900 transition">
      🖥 Desligar tela
    </button>
    <div class="text-5xl font-mono" id="clock">--:--</div>
    <div class="text-xl text-gray-400" id="date">--</div>
    <div class="text-xl text-green-400" id="temp">🌡 --°C</div>
  </div>

  <!-- FAIXA CENTRAL / LETTERBOX -->
  <div id="radioBackground" class="relative flex items-center justify-center h-1/3 border-b border-t border-gray-800">

    <div class="absolute inset-0 bg-black/55"></div>

    <div id="radioDisplay"
      class="relative z-10 text-green-400 text-5xl font-mono px-12 py-6 border border-green-600 rounded-xl bg-black/60 backdrop-blur-sm shadow-xl">
      Desligado
    </div>
  </div>

  <!-- MOSAICO -->
  <div class="flex-1 p-6">
    <div id="radioGrid" class="grid grid-cols-4 gap-6 h-full"></div>
  </div>

</div>

<audio id="player"></audio>

<div id="screenOff" class="hidden fixed inset-0 bg-black z-50"></div>

<script>
const RADIOS = [
  {
    nome:"Manchete",
    logo:"https://static-media.streema.com/media/cache/bb/72/bb720272f1f110a8fb90a3b2e697c986.jpg",
    bg:"https://w0.peakpx.com/wallpaper/914/1012/HD-wallpaper-rio-de-janeiro-brazil-city-travel-rio-de-janeiro-cities-brazil.jpg"
  },
  {
    nome:"ClassicPan",
    logo:"https://static.mytuner.mobi/media/tvos_radios/337/jp-classic-pan.cf47ddce.jpg",
    bg:"https://www.shutterstock.com/image-photo/paulo-sp-brazil-may-1-600nw-2462025459.jpg"
  },
  {
    nome:"Pampa",
    logo:"https://i1.sndcdn.com/artworks-000272965253-n2034k-t500x500.jpg",
    bg:"https://i.pinimg.com/736x/d9/26/76/d926766b5a0d4b42c3156d2cea4307a4.jpg"
  },
  {
    nome:"Cultura",
    logo:"https://upload.wikimedia.org/wikipedia/commons/0/01/Cultura_FM_sp.jpg",
    bg:"https://media.istockphoto.com/id/1218290789/photo/traffic-at-radio-city-music-hall-manhattan-new-york-city.jpg"
  }
];

const URLS = {
  "Manchete": "https://8410.brasilstream.com.br/stream?origem=site",
  "ClassicPan": "https://stream.zeno.fm/rtk4pzcome3vv",
  "Pampa": "https://cast4.audiostream.com.br:2653/mp3",
  "Cultura": "https://player-culturafm.stream.uol.com.br/live/culturafm.m3u8"
};

let indiceSelecionado = 0;

const player = document.getElementById("player");
const display = document.getElementById("radioDisplay");
const grid = document.getElementById("radioGrid");
const bg = document.getElementById("radioBackground");

function tocarRadio(radio){
  player.src = URLS[radio.nome];
  player.play().catch(()=>{});
  display.textContent = radio.nome;
  bg.style.backgroundImage = `url('${radio.bg}')`;
  destacar(radio.nome);
}

function destacar(nome){
  document.querySelectorAll('.radio-btn').forEach(b=>{
    b.classList.remove('ring-2','ring-green-500');
  });
  const btn = document.getElementById('btn-'+nome);
  if(btn) btn.classList.add('ring-2','ring-green-500');
}

function criarBotoes(){
  RADIOS.forEach((radio,i)=>{
    const btn = document.createElement('button');
    btn.id = 'btn-'+radio.nome;
    btn.className = 'radio-btn flex flex-col items-center justify-center rounded-xl border border-gray-700 bg-gray-950 hover:bg-gray-900 transition p-3';

    btn.innerHTML = `
      <img src="${radio.logo}" class="h-20 object-contain mb-3 rounded">
      <div class="text-lg">${radio.nome}</div>
    `;

    btn.onclick = ()=>{
      indiceSelecionado = i;
      tocarRadio(radio);
    };

    grid.appendChild(btn);
  });
}

criarBotoes();

// teclado
document.addEventListener('keydown', e=>{
  const cols = 4;
  if(e.key==='ArrowRight') indiceSelecionado = (indiceSelecionado+1)%RADIOS.length;
  if(e.key==='ArrowLeft') indiceSelecionado = (indiceSelecionado-1+RADIOS.length)%RADIOS.length;
  if(e.key==='ArrowDown') indiceSelecionado = (indiceSelecionado+cols)%RADIOS.length;
  if(e.key==='ArrowUp') indiceSelecionado = (indiceSelecionado-cols+RADIOS.length)%RADIOS.length;
  if(e.key==='Enter') tocarRadio(RADIOS[indiceSelecionado]);
  destacar(RADIOS[indiceSelecionado].nome);
});

// relógio
function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('clock').textContent =
    agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent =
    agora.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
setInterval(atualizarRelogio,1000);
atualizarRelogio();

// temperatura fixa Diadema
async function atualizarTemperatura(){
  try{
    const lat = -23.6865;
    const lon = -46.6234;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    const r = await fetch(url);
    const j = await r.json();
    document.getElementById('temp').textContent =
      `🌡 ${Math.round(j.current_weather.temperature)}°C (Diadema)`;
  }catch{
    document.getElementById('temp').textContent = '🌡 --°C (Diadema)';
  }
}
atualizarTemperatura();
setInterval(atualizarTemperatura,15*60*1000);

// tela preta
let telaApagada = false;
function toggleScreen(){
  const el = document.getElementById('screenOff');
  telaApagada = !telaApagada;
  el.classList.toggle('hidden', !telaApagada);
}

// fullscreen
setTimeout(()=>{
  if(document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen();
},1000);
</script>
</body>
</html>
<audio id="player"></audio>

<!-- TELA PRETA -->
<div id="screenOff" class="hidden fixed inset-0 bg-black z-50"></div>

<script>
const RADIOS = [
  {nome:"Manchete", logo:"📺"},
  {nome:"ClassicPan", logo:"🎷"},
  {nome:"Pampa", logo:"🌾"},
  {nome:"Cultura", logo:"🎭"}
];

const URLS = {
  "Manchete": "https://8410.brasilstream.com.br/stream?origem=site",
  "ClassicPan": "https://stream.zeno.fm/rtk4pzcome3vv",
  "Pampa": "https://cast4.audiostream.com.br:2653/mp3",
  "Cultura": "https://player-culturafm.stream.uol.com.br/live/culturafm.m3u8"
};

let indiceSelecionado = 0;
let radioAtual = null;

const player = document.getElementById("player");
const display = document.getElementById("radioDisplay");
const grid = document.getElementById("radioGrid");

function tocarClick(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator();
  o.frequency.value = 800;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),50);
}

function tocarRadio(nome){
  radioAtual = nome;
  player.src = URLS[nome];
  player.play().catch(()=>{});
  display.textContent = nome;
  destacar(nome);
  tocarClick();
}

function destacar(nome){
  document.querySelectorAll('.radio-btn').forEach(b=>{
    b.classList.remove('border-green-500','bg-green-900/40','ring-2','ring-green-500');
  });
  const btn = document.getElementById('btn-'+nome);
  if(btn) btn.classList.add('border-green-500','bg-green-900/40','ring-2','ring-green-500');
}

function atualizarSelecao(){
  const nome = RADIOS[indiceSelecionado].nome;
  destacar(nome);
}

function criarBotoes(){
  RADIOS.forEach((radio,i)=>{
    const btn = document.createElement('button');
    btn.id = 'btn-'+radio.nome;
    btn.className = 'radio-btn flex flex-col items-center justify-center text-2xl rounded-xl border border-gray-700 bg-gray-950 hover:bg-gray-900 transition focus:outline-none';
    btn.innerHTML = `<div class="text-4xl">${radio.logo}</div><div>${radio.nome}</div>`;
    btn.onclick = ()=>{ indiceSelecionado=i; tocarRadio(radio.nome); };
    grid.appendChild(btn);
  });
}

criarBotoes();
atualizarSelecao();

// TECLADO
document.addEventListener('keydown', e=>{
  const cols = 4;
  if(e.key==='ArrowRight') indiceSelecionado = (indiceSelecionado+1)%RADIOS.length;
  if(e.key==='ArrowLeft') indiceSelecionado = (indiceSelecionado-1+RADIOS.length)%RADIOS.length;
  if(e.key==='ArrowDown') indiceSelecionado = (indiceSelecionado+cols)%RADIOS.length;
  if(e.key==='ArrowUp') indiceSelecionado = (indiceSelecionado-cols+RADIOS.length)%RADIOS.length;
  if(e.key==='Enter') tocarRadio(RADIOS[indiceSelecionado].nome);
  atualizarSelecao();
});

// RELÓGIO
function atualizarRelogio(){
  const agora = new Date();
  document.getElementById('clock').textContent =
    agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent =
    agora.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
setInterval(atualizarRelogio,1000);
atualizarRelogio();

// 🌡 TEMPERATURA FIXA — DIadema/SP
async function atualizarTemperatura(){
  try{
    const lat = -23.6865;
    const lon = -46.6234;

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    const r = await fetch(url);
    const j = await r.json();

    document.getElementById('temp').textContent =
      `🌡 ${Math.round(j.current_weather.temperature)}°C (Diadema)`;
  }catch{
    document.getElementById('temp').textContent = '🌡 --°C (Diadema)';
  }
}

atualizarTemperatura();
setInterval(atualizarTemperatura, 15*60*1000);

// TELA PRETA
let telaApagada = false;
function toggleScreen(){
  const el = document.getElementById('screenOff');
  telaApagada = !telaApagada;
  el.classList.toggle('hidden', !telaApagada);
}

// TELA CHEIA
function fullscreen(){
  if(document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen();
}
setTimeout(fullscreen,1000);
</script>
</body>
</html>
